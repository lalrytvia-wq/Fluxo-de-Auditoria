<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lousa Estratégica de Auditoria</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Compilação JSX no browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Exportação PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- PDF.js (Visualizador de PDF interno que contorna bloqueios do navegador) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- SheetJS (Leitor de Excel Estável) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Jspreadsheet CE e JSuites (Planilha Interativa Estável) -->
    <script src="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce/dist/index.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce/dist/jspreadsheet.css" type="text/css" />

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .main-viewport { outline: none; }

        /* BLINDAGEM DE CONEXÃO: Torna a etapa 100% receptiva a links */
        body.is-connecting .node-container {
            cursor: crosshair !important;
        }
        
        /* Desativa interações internas para o drag da linha não bater em botões/textos */
        body.is-connecting .node-container * {
            pointer-events: none !important;
        }

        /* Efeito de "Mira" ao passar a linha por cima da etapa destino */
        body.is-connecting .node-container:hover {
            box-shadow: 0 0 0 6px rgba(123, 17, 19, 0.4) !important;
            border-color: #7b1113 !important;
            transition: all 0.2s ease;
        }

        /* Ajustes Jspreadsheet para Tailwind */
        .jexcel_container { font-family: inherit !important; width: 100% !important; height: 100% !important; }
        .jexcel > thead > tr > td { background-color: #f8fafc; font-weight: bold; color: #475569; }
        .jexcel > tbody > tr > td { color: #334155; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        // --- MAPEAMENTO DE ÍCONES ---
        const Plus = (props) => <i className={`fa-solid fa-plus ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Trash2 = (props) => <i className={`fa-solid fa-trash-can ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Maximize2 = (props) => <i className={`fa-solid fa-expand ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Minimize2 = (props) => <i className={`fa-solid fa-compress ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Save = (props) => <i className={`fa-solid fa-floppy-disk ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronDown = (props) => <i className={`fa-solid fa-chevron-down ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronUp = (props) => <i className={`fa-solid fa-chevron-up ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Building2 = (props) => <i className={`fa-solid fa-building ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const User = (props) => <i className={`fa-solid fa-user ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const MapPin = (props) => <i className={`fa-solid fa-location-dot ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Camera = (props) => <i className={`fa-solid fa-camera ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ImageIcon = (props) => <i className={`fa-regular fa-image ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const X = (props) => <i className={`fa-solid fa-xmark ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ZoomIn = (props) => <i className={`fa-solid fa-magnifying-glass-plus ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Expand = (props) => <i className={`fa-solid fa-up-right-and-down-left-from-center ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Tag = (props) => <i className={`fa-solid fa-tag ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Target = (props) => <i className={`fa-solid fa-bullseye ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const FileDown = (props) => <i className={`fa-solid fa-file-pdf ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const FilePdf = (props) => <i className={`fa-solid fa-file-pdf ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const FileExcel = (props) => <i className={`fa-solid fa-file-excel ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronLeft = (props) => <i className={`fa-solid fa-chevron-left ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronRight = (props) => <i className={`fa-solid fa-chevron-right ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const AlertTriangle = (props) => <i className={`fa-solid fa-triangle-exclamation ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Activity = (props) => <i className={`fa-solid fa-chart-line ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const PlusCircle = (props) => <i className={`fa-solid fa-circle-plus ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const FileImport = (props) => <i className={`fa-solid fa-file-import ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Archive = (props) => <i className={`fa-solid fa-box-archive ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const HistoryIcon = (props) => <i className={`fa-solid fa-clock-rotate-left ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Flag = (props) => <i className={`fa-solid fa-flag ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;

        const GRENA_COLOR = "#7b1113";

        const analyzeRisk = (data) => {
            const textToAnalyze = `${data.weakness || ''} ${data.description || ''} ${data.title || ''}`.toLowerCase();
            const critical = ['fraude', 'perda', 'interrupção', 'parada', 'multa', 'crítico', 'grave', 'ruptura', 'financeiro', 'corrupção'];
            const attention = ['atraso', 'falha', 'divergência', 'manual', 'desvio', 'inconsistência', 'pendente'];

            if (data.weakness && String(data.weakness).trim() !== '') return 'Alto';
            if (data.pop === 'Não' || critical.some(k => textToAnalyze.includes(k))) return 'Alto';
            if (attention.some(k => textToAnalyze.includes(k))) return 'Médio';
            return 'Baixo';
        };

        // --- SUB-COMPONENTE: CAMPO CUSTOMIZADO ---
        const CustomFieldItem = ({ 
            nodeId, 
            nodeTitle, 
            field, 
            updateCustomField, 
            removeCustomField, 
            onOpenFullscreenText,
            onOpenFullscreenPhoto,
            onOpenFullscreenPdf,
            onOpenFullscreenExcel
        }) => {
            const photoRef = useRef(null);
            const pdfRef = useRef(null);
            const excelRef = useRef(null);

            // LIMITE DE TAMANHO (2MB) - Impede que arquivos imensos quebrem a memória do navegador
            const MAX_FILE_SIZE = 2 * 1024 * 1024;

            const handlePhotoUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    if (file.size > MAX_FILE_SIZE) {
                        alert(`A imagem "${file.name}" tem mais de 2MB. Use arquivos menores para evitar lentidão e falhas no salvamento.`);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const currentPhotos = field.photos || [];
                        updateCustomField(nodeId, field.id, 'photos', [...currentPhotos, reader.result]);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            };

            const handlePdfUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > MAX_FILE_SIZE) {
                    alert(`O PDF "${file.name}" tem mais de 2MB. O limite existe para não travar o cache da Lousa.`);
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onloadend = () => {
                    const currentPdfs = field.pdfs || [];
                    const newPdf = { id: Date.now(), name: file.name, data: reader.result };
                    updateCustomField(nodeId, field.id, 'pdfs', [...currentPdfs, newPdf]);
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > MAX_FILE_SIZE) {
                    alert("A planilha excede 2MB. Use planilhas mais leves apenas para demonstração dos dados.");
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        if (!window.XLSX) {
                            alert("A biblioteca Excel ainda está carregando. Tente novamente em alguns segundos.");
                            return;
                        }
                        const workbook = window.XLSX.read(data, {type: 'array'});
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        const rawJson = window.XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ''});
                        
                        const currentExcels = field.excels || [];
                        const newExcel = { id: Date.now(), name: file.name, data: rawJson };
                        updateCustomField(nodeId, field.id, 'excels', [...currentExcels, newExcel]);
                    } catch (err) {
                        console.error("Erro ao processar Excel:", err);
                        alert("Falha ao ler o arquivo Excel. Verifique se não está corrompido.");
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const removeAttachment = (type, index) => {
                const currentArr = [...(field[type] || [])];
                currentArr.splice(index, 1);
                updateCustomField(nodeId, field.id, type, currentArr);
            };

            return (
                <div className="space-y-2 p-3 bg-white border border-slate-200 shadow-sm rounded-xl relative group/field animate-in slide-in-from-top-2 duration-300">
                    <div className="flex items-center justify-between">
                        <input 
                            value={field.label}
                            onChange={(e) => updateCustomField(nodeId, field.id, 'label', e.target.value)}
                            onMouseDown={e => e.stopPropagation()}
                            className="text-[10px] font-black text-[#7b1113] uppercase tracking-wider bg-transparent outline-none w-full border-b border-transparent focus:border-[#7b1113]/30 transition-colors"
                            placeholder="TÍTULO DO CAMPO"
                        />
                        <div className="flex items-center gap-2">
                            <button onMouseDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onOpenFullscreenText(field.value, field.label, nodeTitle); }} className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-slate-600 transition-colors" title="Maximizar Texto">
                                <Expand size={12} />
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); removeCustomField(nodeId, field.id); }} className="opacity-0 group-hover/field:opacity-100 p-1 text-rose-400 hover:text-rose-600 transition-opacity" title="Excluir Campo">
                                <Trash2 size={12} />
                            </button>
                        </div>
                    </div>
                    
                    <textarea 
                        value={field.value}
                        onChange={(e) => updateCustomField(nodeId, field.id, 'value', e.target.value)}
                        onMouseDown={e => e.stopPropagation()}
                        className="w-full bg-slate-50 border border-slate-200 text-xs p-2 rounded-lg outline-none resize-none min-h-[50px] focus:ring-1 focus:ring-[#7b1113]/20 transition-all text-slate-700"
                        placeholder="Insira as anotações..."
                        onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                    />

                    <div className="flex items-center justify-between pt-1 border-t border-slate-100">
                        <div className="flex gap-2">
                            <button onMouseDown={e => e.stopPropagation()} onClick={() => photoRef.current.click()} className="text-slate-400 hover:text-blue-600 transition-colors" title="Anexar Foto">
                                <Camera size={14} />
                            </button>
                            <button onMouseDown={e => e.stopPropagation()} onClick={() => pdfRef.current.click()} className="text-slate-400 hover:text-rose-600 transition-colors" title="Anexar PDF">
                                <FilePdf size={14} />
                            </button>
                            <button onMouseDown={e => e.stopPropagation()} onClick={() => excelRef.current.click()} className="text-slate-400 hover:text-emerald-600 transition-colors" title="Anexar Planilha Excel">
                                <FileExcel size={14} />
                            </button>
                        </div>
                        <div className="text-[8px] font-bold text-slate-300 uppercase tracking-widest">
                            Anexos Individuais
                        </div>
                    </div>

                    <input type="file" accept="image/*" multiple ref={photoRef} onChange={handlePhotoUpload} className="hidden" />
                    <input type="file" accept="application/pdf" ref={pdfRef} onChange={handlePdfUpload} className="hidden" />
                    <input type="file" accept=".xlsx, .xls, .csv" ref={excelRef} onChange={handleExcelUpload} className="hidden" />

                    <div className="space-y-2 mt-2">
                        {field.photos && field.photos.length > 0 && (
                            <div className="grid grid-cols-4 gap-1">
                                {field.photos.map((ph, idx) => (
                                    <div key={idx} className="relative group aspect-square rounded border border-slate-200 cursor-pointer overflow-hidden" onClick={(e) => { e.stopPropagation(); onOpenFullscreenPhoto(field.photos, idx, `${nodeTitle} - ${field.label}`); }}>
                                        <img src={ph} className="w-full h-full object-cover group-hover:scale-110 transition-transform" />
                                        <button onClick={(e) => { e.stopPropagation(); removeAttachment('photos', idx); }} className="absolute top-0 right-0 bg-black/60 text-white p-0.5 opacity-0 group-hover:opacity-100"><X size={8} /></button>
                                    </div>
                                ))}
                            </div>
                        )}
                        {field.pdfs && field.pdfs.length > 0 && (
                            <div className="flex flex-col gap-1">
                                {field.pdfs.map((pdf, idx) => (
                                    <div key={idx} className="flex items-center justify-between bg-rose-50 border border-rose-100 p-1.5 rounded cursor-pointer hover:bg-rose-100 transition-colors" onClick={(e) => { e.stopPropagation(); onOpenFullscreenPdf(pdf, `${nodeTitle} - ${field.label}`); }}>
                                        <div className="flex items-center gap-2 overflow-hidden">
                                            <FilePdf size={12} className="text-rose-600 flex-shrink-0" />
                                            <span className="text-[10px] font-bold text-rose-800 truncate">{pdf.name}</span>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); removeAttachment('pdfs', idx); }} className="text-rose-400 hover:text-rose-700 p-1"><X size={10}/></button>
                                    </div>
                                ))}
                            </div>
                        )}
                        {field.excels && field.excels.length > 0 && (
                            <div className="flex flex-col gap-1">
                                {field.excels.map((ex, idx) => (
                                    <div key={idx} className="flex items-center justify-between bg-emerald-50 border border-emerald-100 p-1.5 rounded cursor-pointer hover:bg-emerald-100 transition-colors" onClick={(e) => { e.stopPropagation(); onOpenFullscreenExcel(ex, nodeId, field.id, `${nodeTitle} - ${field.label}`); }}>
                                        <div className="flex items-center gap-2 overflow-hidden">
                                            <FileExcel size={12} className="text-emerald-600 flex-shrink-0" />
                                            <span className="text-[10px] font-bold text-emerald-800 truncate">{ex.name}</span>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); removeAttachment('excels', idx); }} className="text-emerald-400 hover:text-emerald-700 p-1"><X size={10}/></button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE DO BLOCO (ETAPA PRINCIPAL) ---
        const NodeItem = ({ 
            node, 
            updateNodeData, 
            deleteNode, 
            toggleExpand, 
            draggingNodeId, 
            activeNodeId,
            handleMouseDown,
            startConnection,
            onOpenFullscreenPhoto,
            onOpenFullscreenText,
            onOpenFullscreenPdf,
            onOpenFullscreenExcel,
            addCustomField,
            updateCustomField,
            removeCustomField
        }) => {
            const { id, data, expanded, x, y } = node;
            const fileInputRef = useRef(null);
            
            const isEndNode = node.type === 'end';
            
            const colors = isEndNode ? { border: 'border-slate-800', bg: 'bg-slate-50', accent: 'bg-slate-800', text: 'text-slate-800' } :
                           data.risk === 'Alto' ? { border: 'border-rose-600', bg: 'bg-rose-50', accent: 'bg-rose-600', text: 'text-rose-800' } :
                           data.risk === 'Médio' ? { border: 'border-amber-500', bg: 'bg-amber-50', accent: 'bg-amber-500', text: 'text-amber-800' } :
                           { border: 'border-emerald-500', bg: 'bg-emerald-50', accent: 'bg-emerald-600', text: 'text-emerald-800' };

            const zIndex = draggingNodeId === id ? 2000 : (activeNodeId === id ? 1500 : 10);

            return (
                <div 
                    className="absolute transition-all duration-300 ease-in-out node-container"
                    style={{ left: x, top: y, width: expanded ? '350px' : '200px', zIndex: zIndex, transform: draggingNodeId === id ? 'scale(1.02)' : 'scale(1)' }}
                    onMouseDown={(e) => handleMouseDown(e, id)}
                    data-nodeid={id} // MARCADOR CRUCIAL PARA A LINHA DETECTAR O CARD INTEIRO
                >
                    <div className="mb-2 flex justify-center">
                        <div className="flex items-center gap-1 bg-white px-3 py-1 rounded-full border border-slate-300 shadow-md group hover:border-[#7b1113]/50 transition-colors">
                        <Tag size={10} className="text-[#7b1113]" />
                        <input 
                            value={data.superTitle || ''}
                            onChange={(e) => updateNodeData(id, 'superTitle', e.target.value)}
                            onMouseDown={e => e.stopPropagation()}
                            className="bg-transparent text-[10px] font-black text-[#7b1113] uppercase tracking-widest outline-none text-center min-w-[60px] w-auto placeholder:text-slate-400"
                            placeholder="Rótulo"
                        />
                        </div>
                    </div>

                    <div className={`rounded-2xl shadow-xl border-2 overflow-hidden flex flex-col ${colors.border} ${colors.bg} relative node-content transition-all`}>
                        
                        {/* CONECTOR (Bolinha) - Oculto se for o nó final */}
                        {!isEndNode && (
                            <div 
                                className="absolute right-[-14px] top-[46px] w-7 h-7 bg-white border-2 border-slate-300 rounded-full flex items-center justify-center cursor-crosshair hover:scale-110 hover:border-[#7b1113] shadow-md z-50 group/handle transition-all"
                                onMouseDown={(e) => {
                                    e.preventDefault(); 
                                    e.stopPropagation(); 
                                    startConnection(e, id);
                                }}
                                title="Arraste para conectar a outra etapa"
                            >
                                <div className="w-3 h-3 bg-slate-300 rounded-full group-hover/handle:bg-[#7b1113] transition-colors pointer-events-none"></div>
                            </div>
                        )}

                        <div className={`p-3 flex items-center justify-between flex-shrink-0 ${expanded ? 'border-b border-slate-200 bg-white' : 'bg-transparent'}`}>
                            <div className="flex items-center gap-2 flex-1 overflow-hidden">
                                <div className={`w-3 h-3 rounded-full flex-shrink-0 ${colors.accent}`}></div>
                                <input 
                                    value={data.title || ''}
                                    onChange={(e) => updateNodeData(id, 'title', e.target.value)}
                                    onMouseDown={e => e.stopPropagation()}
                                    className={`font-bold text-sm bg-transparent outline-none w-full text-slate-800 focus:bg-slate-50 rounded px-1 truncate ${!expanded ? 'cursor-default' : ''}`}
                                    placeholder="Título"
                                    readOnly={!expanded}
                                />
                            </div>
                            <div className="flex items-center gap-2 ml-2 pr-2">
                                <button onClick={(e) => { e.stopPropagation(); toggleExpand(id); }} className="p-1 hover:bg-slate-100 rounded-md transition-colors text-slate-500">
                                    {expanded ? <ChevronUp size={14}/> : <Maximize2 size={12}/>}
                                </button>
                                {expanded && (
                                <button onClick={(e) => { e.stopPropagation(); deleteNode(id); }} className="p-1 hover:bg-rose-100 rounded-md text-rose-500 transition-colors">
                                    <Trash2 size={14}/>
                                </button>
                                )}
                            </div>
                        </div>

                        {/* ÁREA DE CONTEÚDO */}
                        <div className={`transition-all duration-300 ease-in-out overflow-hidden ${expanded ? 'max-h-none opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="p-4 space-y-4">
                                <div className="grid grid-cols-1 gap-2 bg-white p-3 rounded-xl border border-slate-300 shadow-sm">
                                    <div className="flex items-center gap-2 border-b border-slate-200 pb-2">
                                        <Building2 size={14} className="text-slate-500 flex-shrink-0"/>
                                        <input value={data.department || ''} onChange={(e) => updateNodeData(id, 'department', e.target.value)} onMouseDown={e => e.stopPropagation()} className="text-xs bg-transparent outline-none w-full text-slate-800 placeholder:text-slate-400 font-medium" placeholder="Departamento..." />
                                    </div>
                                    <div className="flex items-center gap-2 border-b border-slate-200 pb-2">
                                        <User size={14} className="text-slate-500 flex-shrink-0"/>
                                        <input value={data.collaborator || ''} onChange={(e) => updateNodeData(id, 'collaborator', e.target.value)} onMouseDown={e => e.stopPropagation()} className="text-xs bg-transparent outline-none w-full text-slate-800 placeholder:text-slate-400 font-medium" placeholder="Colaborador..." />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <MapPin size={14} className="text-slate-500 flex-shrink-0"/>
                                        <input value={data.originUnit || ''} onChange={(e) => updateNodeData(id, 'originUnit', e.target.value)} onMouseDown={e => e.stopPropagation()} className="text-xs bg-transparent outline-none w-full text-slate-800 placeholder:text-slate-400 font-medium" placeholder="Unidade..." />
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <div className="flex items-center justify-between">
                                        <label className="text-[9px] font-black text-slate-500 uppercase tracking-wider">Mapeamento</label>
                                        <button onMouseDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onOpenFullscreenText(data.description, 'Mapeamento', data.title); }} className="p-1 hover:bg-slate-200 rounded text-slate-500">
                                            <Expand size={12} />
                                        </button>
                                    </div>
                                    <textarea 
                                        value={data.description || ''} 
                                        onChange={(e) => updateNodeData(id, 'description', e.target.value)} 
                                        onMouseDown={e => e.stopPropagation()} 
                                        className="w-full bg-white border border-slate-300 shadow-sm text-xs p-2 rounded-lg outline-none resize-none min-h-[80px] text-slate-700 focus:ring-2 focus:ring-[#7b1113]/20 focus:border-[#7b1113] transition-all" 
                                        placeholder="Descreva o fluxo..." 
                                        onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-slate-500 uppercase">Possui POP?</label>
                                        <select value={data.pop || 'Sim'} onChange={(e) => updateNodeData(id, 'pop', e.target.value)} onMouseDown={e => e.stopPropagation()} className={`w-full text-xs p-2 rounded-lg outline-none font-bold border border-slate-300 shadow-sm ${data.pop === 'Não' ? 'bg-rose-50 text-rose-700 border-rose-300' : 'bg-white text-slate-700'}`}>
                                            <option value="Sim">Sim</option>
                                            <option value="Não">Não</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-slate-500 uppercase">Risco</label>
                                        <div className={`text-xs p-2 rounded-lg font-bold text-center border shadow-sm ${data.risk === 'Alto' ? 'bg-rose-50 text-rose-700 border-rose-300' : data.risk === 'Médio' ? 'bg-amber-50 text-amber-700 border-amber-300' : 'bg-emerald-50 text-emerald-700 border-emerald-300'}`}>
                                            {data.risk || 'Baixo'}
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <div className="flex items-center justify-between">
                                        <label className="text-[9px] font-black text-rose-600 uppercase tracking-wider">Fragilidades</label>
                                        <button onMouseDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onOpenFullscreenText(data.weakness, 'Fragilidades', data.title); }} className="p-1 hover:bg-rose-100 rounded text-rose-500">
                                            <Expand size={12} />
                                        </button>
                                    </div>
                                    <textarea 
                                        value={data.weakness || ''} 
                                        onChange={(e) => updateNodeData(id, 'weakness', e.target.value)} 
                                        onMouseDown={e => e.stopPropagation()} 
                                        className={`w-full bg-white text-xs p-2 rounded-lg outline-none resize-none min-h-[80px] border border-slate-300 shadow-sm focus:ring-2 focus:ring-[#7b1113]/20 focus:border-[#7b1113] transition-all text-slate-700 border-l-4 ${data.risk === 'Alto' ? 'border-l-rose-500' : 'border-l-slate-400'}`} 
                                        placeholder="Pontos críticos..." 
                                        onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                                    />
                                </div>

                                {/* LISTA DE CAMPOS CUSTOMIZADOS */}
                                <div className="space-y-4 pt-2 border-t border-slate-200/50">
                                    {data.customFields?.map((field) => (
                                        <CustomFieldItem 
                                            key={field.id}
                                            nodeId={id}
                                            nodeTitle={data.title}
                                            field={field}
                                            updateCustomField={updateCustomField}
                                            removeCustomField={removeCustomField}
                                            onOpenFullscreenText={onOpenFullscreenText}
                                            onOpenFullscreenPhoto={onOpenFullscreenPhoto}
                                            onOpenFullscreenPdf={onOpenFullscreenPdf}
                                            onOpenFullscreenExcel={onOpenFullscreenExcel}
                                        />
                                    ))}
                                    
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); addCustomField(id); }}
                                        className="w-full py-2 border-2 border-dashed border-slate-300 bg-slate-50 rounded-xl flex items-center justify-center gap-2 text-[10px] font-black text-slate-500 hover:border-[#7b1113]/40 hover:text-[#7b1113] hover:bg-[#7b1113]/5 transition-all group shadow-sm"
                                    >
                                        <PlusCircle size={14} className="group-hover:scale-110 transition-transform" /> 
                                        ADICIONAR PONTO ESPECÍFICO
                                    </button>
                                </div>
                                
                            </div>
                            <div className="px-3 py-2 flex items-center justify-between text-[10px] text-slate-400 font-bold bg-white/20 border-t border-slate-200">
                                <span>ETAPA AUDITADA</span>
                                <span className="opacity-50 tracking-widest">{String(id).slice(-4)}</span>
                            </div>
                        </div>

                        {!expanded && (
                        <div className={`px-3 py-1.5 text-[9px] font-black uppercase text-center rounded-b-2xl opacity-90 ${colors.text} flex items-center justify-center gap-2 border-t border-white/20`}>
                            {data.customFields?.some(f => f.photos?.length > 0) && <Camera size={10} className="text-[#7b1113] animate-pulse" />}
                            {isEndNode ? 'PROCESSO CONCLUÍDO' : `${data.risk} Risco`}
                        </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL (APLICAÇÃO) ---
        function App() {
            const [nodes, setNodes] = useState([]);
            const [edges, setEdges] = useState([]);
            const [zoom, setZoom] = useState(0.85);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            
            // Drag e Conexões
            const [isDraggingCanvas, setIsDraggingCanvas] = useState(false);
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [activeNodeId, setActiveNodeId] = useState(null); 
            
            const [connectingFrom, setConnectingFrom] = useState(null);
            const [cursorPos, setCursorPos] = useState({ x: 0, y: 0 });

            const [saveStatus, setSaveStatus] = useState(null);
            
            // Histórico (Sidebar Lateral)
            const [sidebarState, setSidebarState] = useState('closed'); // 'closed', 'normal', 'maximized'
            const [savedFlows, setSavedFlows] = useState([]);

            // Estados para visualizadores
            const [fullscreenPhotos, setFullscreenPhotos] = useState(null);
            const [photoIndex, setPhotoIndex] = useState(0);
            const [fullscreenText, setFullscreenText] = useState(null);
            const [fullscreenTextLabel, setFullscreenTextLabel] = useState("");
            const [fullscreenTitle, setFullscreenTitle] = useState("");
            const [fullscreenPdf, setFullscreenPdf] = useState(null); 
            const [isRenderingPdf, setIsRenderingPdf] = useState(false);
            const pdfContainerRef = useRef(null);
            const [fullscreenExcel, setFullscreenExcel] = useState(null); 
            const jexcelContainerRef = useRef(null);

            const canvasRef = useRef(null);
            const exportRef = useRef(null);
            const importFileRef = useRef(null);

            // EFEITO: BLINDAGEM DE CONEXÃO
            useEffect(() => {
                if (connectingFrom) {
                    document.body.classList.add('is-connecting');
                } else {
                    document.body.classList.remove('is-connecting');
                }
            }, [connectingFrom]);

            // EFEITO: RENDERIZAÇÃO DO PDF COM PDF.JS (Evita bloqueios do Edge/Chrome)
            useEffect(() => {
                if (fullscreenPdf && fullscreenPdf.pdf.data) {
                    setIsRenderingPdf(true);
                    const loadPdf = async () => {
                        try {
                            const base64Data = fullscreenPdf.pdf.data.split(',')[1];
                            const binaryString = window.atob(base64Data);
                            const bytes = new Uint8Array(binaryString.length);
                            for (let i = 0; i < binaryString.length; i++) {
                                bytes[i] = binaryString.charCodeAt(i);
                            }

                            const loadingTask = window.pdfjsLib.getDocument({ data: bytes });
                            const pdf = await loadingTask.promise;
                            
                            const container = pdfContainerRef.current;
                            if (!container) return;
                            container.innerHTML = ''; 

                            // Renderiza todas as páginas
                            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                                const page = await pdf.getPage(pageNum);
                                const viewport = page.getViewport({ scale: 1.5 }); 
                                const canvas = document.createElement('canvas');
                                canvas.className = "mb-4 max-w-full h-auto shadow-lg border border-slate-200 bg-white";
                                const context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;
                                container.appendChild(canvas);

                                const renderContext = {
                                    canvasContext: context,
                                    viewport: viewport
                                };
                                await page.render(renderContext).promise;
                            }
                        } catch (err) {
                            console.error("Erro ao renderizar PDF:", err);
                            if (pdfContainerRef.current) {
                                pdfContainerRef.current.innerHTML = '<div class="text-rose-500 font-bold p-4 text-center bg-white rounded-lg shadow mt-10">Falha ao processar a pré-visualização. Por favor, utilize o botão de Baixar.</div>';
                            }
                        } finally {
                            setIsRenderingPdf(false);
                        }
                    };
                    
                    // Um pequeno atraso para a UI exibir o modal antes de iniciar o processamento pesado
                    setTimeout(loadPdf, 100); 
                }
            }, [fullscreenPdf]);

            // CARREGAMENTO INICIAL
            useEffect(() => {
                try {
                    const history = localStorage.getItem('audit_flow_history_v1');
                    if (history) setSavedFlows(JSON.parse(history));

                    const savedState = localStorage.getItem('audit_flow_current_state');
                    if (savedState) {
                        const parsed = JSON.parse(savedState);
                        setNodes(parsed.nodes || []);
                        setEdges(parsed.edges || []);
                        return;
                    }
                } catch (e) { 
                    console.error("Storage access error:", e); 
                }
                
                setNodes([{
                    id: '1', x: 100, y: 50, type: 'start', expanded: true,
                    data: { superTitle: 'AUDITORIA', title: 'Início do Processo', pop: 'Sim', risk: 'Baixo', customFields: [] }
                }]);
            }, []);

            // SALVAMENTO AUTOMÁTICO DO ESTADO ATUAL (Com Proteção de Erro de Memória)
            useEffect(() => {
                if (nodes.length > 0) {
                    try {
                        localStorage.setItem('audit_flow_current_state', JSON.stringify({ nodes, edges }));
                    } catch (error) {
                        console.error("Erro ao salvar no cache (provavelmente as imagens/arquivos excederam o limite):", error);
                        // O catch previne que a aplicação inteira quebre em caso de 'QuotaExceededError'.
                    }
                }
            }, [nodes, edges]);

            // Excel Jspreadsheet Configuração e Inicialização
            useEffect(() => {
                let timeoutId;
                if (fullscreenExcel) {
                    timeoutId = setTimeout(() => {
                        if (jexcelContainerRef.current) {
                            try {
                                jexcelContainerRef.current.innerHTML = '';
                                let rawData = fullscreenExcel.data;
                                if (!rawData || !Array.isArray(rawData) || rawData.length === 0) {
                                    rawData = [['', '', '', ''], ['', '', '', ''], ['', '', '', '']];
                                }
                                
                                const maxRows = Math.max(rawData.length, 10);
                                const maxCols = Math.max(...rawData.map(r => Array.isArray(r) ? r.length : 0), 10);
                                const sheetData = [];
                                for (let i = 0; i < maxRows; i++) {
                                    const row = rawData[i] || [];
                                    const newRow = [];
                                    for (let j = 0; j < maxCols; j++) {
                                        newRow.push(row[j] !== undefined ? row[j] : '');
                                    }
                                    sheetData.push(newRow);
                                }

                                const initFn = window.jspreadsheet || window.jexcel;
                                if (initFn) {
                                    initFn(jexcelContainerRef.current, {
                                        // A configuração moderna da biblioteca exige que a propriedade "data" esteja dentro do array "worksheets"
                                        worksheets: [{
                                            data: sheetData,
                                            minDimensions: [10, 15],
                                            defaultColWidth: 120,
                                            allowInsertColumn: true,
                                            allowInsertRow: true,
                                            allowDeleteColumn: true,
                                            allowDeleteRow: true,
                                            wordWrap: true,
                                        }]
                                    });
                                }
                            } catch (err) {
                                console.error("Erro Excel:", err);
                                alert("Erro ao exibir a planilha do Excel.");
                            }
                        }
                    }, 100); 
                }
                return () => clearTimeout(timeoutId);
            }, [fullscreenExcel]);

            // CORREÇÃO: Salvando edições feitas no modal de volta para a Lousa
            const handleCloseExcel = () => {
                if (jexcelContainerRef.current) {
                    const instance = jexcelContainerRef.current.jspreadsheet || jexcelContainerRef.current.jexcel;
                    if (instance) {
                        // O retorno do Jspreadsheet v5 é um array de worksheets, então extraímos o primeiro elemento.
                        const worksheet = Array.isArray(instance) ? instance[0] : (instance.worksheets ? instance.worksheets[0] : instance);
                        const updatedData = worksheet.getData();
                        
                        setNodes(prev => prev.map(n => {
                            if (n.id === fullscreenExcel.nodeId) {
                                const customFields = (n.data.customFields || []).map(f => {
                                    if (f.id === fullscreenExcel.fieldId) {
                                        const updatedExcels = (f.excels || []).map(ex => 
                                            ex.id === fullscreenExcel.id ? { ...ex, data: updatedData } : ex
                                        );
                                        return { ...f, excels: updatedExcels };
                                    }
                                    return f;
                                });
                                return { ...n, data: { ...n.data, customFields } };
                            }
                            return n;
                        }));
                    }
                }
                setFullscreenExcel(null);
            };

            const riskMetrics = useMemo(() => {
                const total = nodes.length;
                const low = nodes.filter(n => n.data.risk === 'Baixo').length;
                return { complianceRate: total > 0 ? Math.round((low / total) * 100) : 0 };
            }, [nodes]);

            const openFullscreenText = (text, label, title) => {
                setFullscreenText(text || "Sem conteúdo preenchido.");
                setFullscreenTextLabel(label);
                setFullscreenTitle(title || "Sem Título");
            };

            // --- LÓGICA REFORÇADA DE DRAG DA LINHA ---
            const startConnection = useCallback((e, nodeId) => {
                setConnectingFrom(nodeId);
                setCursorPos({ x: (e.clientX - offset.x) / zoom, y: (e.clientY - offset.y) / zoom });
            }, [offset, zoom]);

            const deleteEdge = useCallback((edgeId) => {
                setEdges(prev => prev.filter(e => e.id !== edgeId));
            }, []);

            const handleMouseDown = useCallback((e, nodeId = null) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.closest('button') || fullscreenExcel) {
                    if (nodeId) setActiveNodeId(nodeId);
                    return;
                }
                if (nodeId) {
                    setDraggingNodeId(nodeId); setActiveNodeId(nodeId);
                    const node = nodes.find(n => n.id === nodeId);
                    setDragStart({ x: e.clientX / zoom - node.x, y: e.clientY / zoom - node.y });
                } else {
                    setIsDraggingCanvas(true);
                    setDragStart({ x: e.clientX - offset.x, y: e.clientY - offset.y });
                }
            }, [nodes, offset, zoom, fullscreenExcel]);

            const handleMouseMove = useCallback((e) => {
                if (connectingFrom) {
                    setCursorPos({ x: (e.clientX - offset.x) / zoom, y: (e.clientY - offset.y) / zoom });
                } else if (draggingNodeId) {
                    setNodes(prev => prev.map(n => n.id === draggingNodeId ? { ...n, x: e.clientX / zoom - dragStart.x, y: e.clientY / zoom - dragStart.y } : n));
                } else if (isDraggingCanvas) {
                    setOffset({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
                }
            }, [connectingFrom, draggingNodeId, isDraggingCanvas, dragStart, zoom, offset]);

            // MIRA A LASER DE ALTA PRECISÃO (Busca o Card Inteiro)
            const handleMouseUp = useCallback((e) => {
                if (connectingFrom) {
                    const elementsUnderCursor = document.elementsFromPoint(e.clientX, e.clientY);
                    let targetNodeId = null;
                    
                    for (let el of elementsUnderCursor) {
                        // "closest" busca na árvore inteira a partir do ponto solto
                        const nodeContainer = el.closest ? el.closest('[data-nodeid]') : null;
                        if (nodeContainer) {
                            targetNodeId = nodeContainer.getAttribute('data-nodeid');
                            break; // Achou!
                        }
                    }

                    // Se encontrou uma etapa válida e não for ela mesma, cria a linha
                    if (targetNodeId && targetNodeId !== connectingFrom) {
                        setEdges(prev => {
                            if (prev.some(edge => edge.source === connectingFrom && edge.target === targetNodeId)) return prev;
                            return [...prev, { id: `e_${Date.now()}`, source: connectingFrom, target: targetNodeId }];
                        });
                    }
                }
                
                // Finaliza ações
                setConnectingFrom(null); 
                setDraggingNodeId(null);
                setIsDraggingCanvas(false);
            }, [connectingFrom]);

            const updateNodeData = useCallback((id, field, value) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === id) {
                        const newData = { ...n.data, [field]: value };
                        if (['pop', 'weakness', 'description', 'title'].includes(field)) newData.risk = analyzeRisk(newData);
                        return { ...n, data: newData };
                    }
                    return n;
                }));
            }, []);

            const addCustomField = useCallback((id) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === id) {
                        const customFields = n.data.customFields || [];
                        return { ...n, data: { ...n.data, customFields: [...customFields, { id: Date.now(), label: 'NOVO CAMPO', value: '', photos: [], pdfs: [], excels: [] }] } };
                    }
                    return n;
                }));
            }, []);

            const updateCustomField = useCallback((nodeId, fieldId, key, value) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === nodeId) {
                        const customFields = (n.data.customFields || []).map(f => f.id === fieldId ? { ...f, [key]: value } : f);
                        return { ...n, data: { ...n.data, customFields } };
                    }
                    return n;
                }));
            }, []);

            const removeCustomField = useCallback((nodeId, fieldId) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === nodeId) {
                        const customFields = (n.data.customFields || []).filter(f => f.id !== fieldId);
                        return { ...n, data: { ...n.data, customFields } };
                    }
                    return n;
                }));
            }, []);

            const toggleExpand = useCallback((id) => {
                setActiveNodeId(id);
                setNodes(prev => prev.map(n => n.id === id ? { ...n, expanded: !n.expanded } : n));
            }, []);

            const deleteNode = useCallback((id) => {
                setNodes(prev => prev.filter(n => n.id !== id));
                setEdges(prev => prev.filter(e => e.source !== id && e.target !== id));
            }, []);

            const addNode = useCallback(() => {
                const lastNode = nodes[nodes.length - 1];
                const newNodeId = Date.now().toString();
                const newNode = {
                    id: newNodeId,
                    x: lastNode ? lastNode.x + (lastNode.expanded ? 400 : 250) : 100,
                    y: lastNode ? lastNode.y : 50,
                    type: 'process',
                    data: { superTitle: 'NOVA ETAPA', title: 'Etapa de Auditoria', pop: 'Sim', risk: 'Baixo', customFields: [] },
                    expanded: true
                };
                setNodes(prev => [...prev, newNode]);
                setActiveNodeId(newNodeId);
                if (lastNode && lastNode.type !== 'end') setEdges(prev => [...prev, { id: `e${lastNode.id}-${newNodeId}`, source: lastNode.id, target: newNodeId }]);
            }, [nodes]);

            const addEndNode = useCallback(() => {
                const lastNode = nodes[nodes.length - 1];
                const newNodeId = Date.now().toString();
                const newNode = {
                    id: newNodeId,
                    x: lastNode ? lastNode.x + (lastNode.expanded ? 400 : 250) : 100,
                    y: lastNode ? lastNode.y : 50,
                    type: 'end',
                    data: { superTitle: 'CONCLUSÃO', title: 'Fim do Processo de Auditoria', pop: 'Sim', risk: 'Baixo', description: 'Encerramento do fluxo. Todos os pontos de controle foram verificados.', customFields: [] },
                    expanded: true
                };
                setNodes(prev => [...prev, newNode]);
                setActiveNodeId(newNodeId);
                if (lastNode && lastNode.type !== 'end') setEdges(prev => [...prev, { id: `e${lastNode.id}-${newNodeId}`, source: lastNode.id, target: newNodeId }]);
            }, [nodes]);

            // --- LÓGICA DE HISTÓRICO E ARQUIVAMENTO ---
            const handleEndFlow = () => {
                const flowName = window.prompt("Insira um nome para arquivar este fluxo de auditoria:", `Auditoria de ${new Date().toLocaleDateString('pt-BR')}`);
                if (!flowName) return;

                const newFlow = {
                    id: Date.now().toString(),
                    name: flowName,
                    date: new Date().toISOString(),
                    compliance: riskMetrics.complianceRate,
                    nodes: JSON.parse(JSON.stringify(nodes)),
                    edges: JSON.parse(JSON.stringify(edges))
                };

                const updatedFlows = [newFlow, ...savedFlows];
                setSavedFlows(updatedFlows);
                localStorage.setItem('audit_flow_history_v1', JSON.stringify(updatedFlows));

                // Limpa a lousa para um fluxo novo
                setNodes([{
                    id: Date.now().toString(), x: 100, y: 50, type: 'start', expanded: true,
                    data: { superTitle: 'AUDITORIA', title: 'Início do Processo', pop: 'Sim', risk: 'Baixo', customFields: [] }
                }]);
                setEdges([]);
                setOffset({x: 0, y: 0});
                setZoom(0.85);

                setSaveStatus("Fluxo Encerrado e Salvo no Histórico!");
                setSidebarState('normal'); 
                setTimeout(() => setSaveStatus(null), 3500);
            };

            const handleLoadFlow = (flow) => {
                if (nodes.length > 1 || edges.length > 0) {
                    if(!window.confirm("Atenção: Carregar este fluxo irá substituir a lousa atual. Deseja continuar?")) return;
                }
                setNodes(flow.nodes);
                setEdges(flow.edges);
                setSidebarState('closed');
                setSaveStatus(`Fluxo "${flow.name}" carregado.`);
                setTimeout(() => setSaveStatus(null), 3000);
            };

            const handleDeleteFlow = (id, e) => {
                e.stopPropagation();
                if(!window.confirm("Tem certeza que deseja apagar permanentemente este fluxo do histórico?")) return;
                const updated = savedFlows.filter(f => f.id !== id);
                setSavedFlows(updated);
                localStorage.setItem('audit_flow_history_v1', JSON.stringify(updated));
            };

            // EXPORTAÇÕES (JSON/PDF) MANTIDAS
            const handleSaveAndExport = () => {
                try {
                    const dataObj = { nodes, edges };
                    const dataStr = JSON.stringify(dataObj);
                    const blob = new Blob([dataStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `Backup_Auditoria_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.json`;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    setSaveStatus("Arquivo JSON gerado com sucesso!");
                } catch (e) {
                    setSaveStatus("Aviso: Erro ao salvar.");
                }
                setTimeout(() => setSaveStatus(null), 3500);
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData.nodes && parsedData.edges) {
                            setNodes(parsedData.nodes);
                            setEdges(parsedData.edges);
                            setSaveStatus("Backup importado com sucesso!");
                        } else { alert("Arquivo inválido."); }
                    } catch (error) { alert("Erro ao ler o arquivo."); }
                    setTimeout(() => setSaveStatus(null), 3000);
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleGeneratePDF = async () => {
                setSaveStatus("Processando PDF...");
                try {
                    const canvas = await window.html2canvas(exportRef.current, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width, canvas.height] });
                    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                    pdf.save(`Fluxo_Auditoria_${new Date().toLocaleDateString()}.pdf`);
                } catch (e) { console.error("Erro ao gerar PDF:", e); } 
                finally { setSaveStatus(null); }
            };

            // --- RENDERIZAÇÃO DAS LINHAS (EDGES) ---
            const renderedEdges = useMemo(() => {
                return edges.map(edge => {
                    const source = nodes.find(n => n.id === edge.source);
                    const target = nodes.find(n => n.id === edge.target);
                    if (!source || !target) return null;
                    
                    const sw = source.expanded ? 350 : 200;
                    const sx = source.x + sw; // Lado Direito
                    const sy = source.y + 60; // Altura do Título
                    const tx = target.x;      // Lado Esquerdo
                    const ty = target.y + 60; // Altura do Título
                    const dx = tx - sx; 
                    const dy = ty - sy;
                    
                    const controlDist = Math.max(Math.abs(dx) / 2, 50);
                    const path = `M ${sx} ${sy} C ${sx + controlDist} ${sy}, ${tx - controlDist} ${ty}, ${tx} ${ty}`;
                    
                    const midX = (sx + tx) / 2;
                    const midY = (sy + ty) / 2;

                    return (
                        <g key={edge.id} className="group/edge cursor-pointer" style={{ pointerEvents: 'auto' }}>
                            <path d={path} fill="none" stroke="transparent" strokeWidth="25" onClick={(e) => { e.stopPropagation(); deleteEdge(edge.id); }} />
                            <path d={path} fill="none" stroke="rgba(100, 116, 139, 0.4)" strokeWidth="2" markerEnd="url(#arrowhead)" className="transition-all group-hover/edge:stroke-[#7b1113] pointer-events-none" />
                            
                            <circle cx={midX} cy={midY} r="12" fill="#f8fafc" stroke="#ef4444" strokeWidth="2" className="opacity-0 group-hover/edge:opacity-100 transition-opacity cursor-pointer" onClick={(e) => { e.stopPropagation(); deleteEdge(edge.id); }} />
                            <text x={midX} y={midY} textAnchor="middle" dy="3.5" fontSize="12" fill="#ef4444" className="font-black opacity-0 group-hover/edge:opacity-100 transition-opacity cursor-pointer select-none" onClick={(e) => { e.stopPropagation(); deleteEdge(edge.id); }}>X</text>
                        </g>
                    );
                });
            }, [edges, nodes, deleteEdge]);

            const tempEdge = useMemo(() => {
                if (!connectingFrom) return null;
                const sourceNode = nodes.find(n => n.id === connectingFrom);
                if (!sourceNode) return null;
                
                const sw = sourceNode.expanded ? 350 : 200;
                const sx = sourceNode.x + sw;
                const sy = sourceNode.y + 60;
                const tx = cursorPos.x;
                const ty = cursorPos.y;
                const dx = tx - sx;
                
                const controlDist = Math.max(Math.abs(dx) / 2, 50);
                const path = `M ${sx} ${sy} C ${sx + controlDist} ${sy}, ${tx - controlDist} ${ty}, ${tx} ${ty}`;
                
                return <path d={path} fill="none" stroke="#7b1113" strokeWidth="2" strokeDasharray="5,5" markerEnd="url(#arrowhead-grena)" style={{ pointerEvents: 'none', opacity: 0.6 }} />;
            }, [connectingFrom, cursorPos, nodes]);

            return (
                <div className="h-screen w-full flex flex-col bg-slate-50 font-sans select-none overflow-hidden">
                
                {saveStatus && (
                    <div className="fixed top-20 right-6 bg-[#7b1113] text-white px-6 py-3 rounded-2xl shadow-2xl z-[6000] font-bold text-xs animate-in fade-in slide-in-from-right duration-300">
                    {String(saveStatus)}
                    </div>
                )}

                {/* --- SIDEBAR: HISTÓRICO DE FLUXOS --- */}
                {sidebarState !== 'closed' && (
                    <div className={`fixed left-0 top-16 bottom-0 bg-white shadow-2xl border-r border-slate-200 z-[4000] flex flex-col transition-all duration-300 ease-in-out ${sidebarState === 'maximized' ? 'w-[500px]' : 'w-80'}`}>
                        <div className="p-4 border-b flex items-center justify-between bg-slate-50 flex-shrink-0">
                            <div className="flex items-center gap-2 text-[#7b1113]">
                                <Archive size={16} />
                                <h2 className="font-black text-xs uppercase tracking-widest">Histórico de Auditorias</h2>
                            </div>
                            <div className="flex gap-1">
                                <button onClick={() => setSidebarState(s => s === 'maximized' ? 'normal' : 'maximized')} className="p-2 hover:bg-slate-200 rounded-lg text-slate-500 transition-colors" title="Maximizar / Restaurar">
                                    {sidebarState === 'maximized' ? <Minimize2 size={12}/> : <Maximize2 size={12}/>}
                                </button>
                                <button onClick={() => setSidebarState('closed')} className="p-2 hover:bg-rose-100 rounded-lg text-rose-500 transition-colors" title="Fechar Histórico">
                                    <X size={14}/>
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50">
                            {savedFlows.length === 0 ? (
                                <div className="text-center text-slate-400 font-medium text-xs py-10 opacity-70">
                                    <Archive size={32} className="mx-auto mb-3 opacity-50" />
                                    Nenhum fluxo de auditoria encerrado.
                                </div>
                            ) : (
                                savedFlows.map(flow => (
                                    <div key={flow.id} onClick={() => handleLoadFlow(flow)} className="bg-white border border-slate-200 rounded-xl p-3 shadow-sm hover:shadow-md hover:border-[#7b1113]/30 cursor-pointer transition-all group animate-in slide-in-from-left-4 duration-300">
                                        <div className="flex justify-between items-start mb-2 gap-2">
                                            <h3 className="font-bold text-slate-800 text-sm leading-tight flex-1">{flow.name}</h3>
                                            <button onClick={(e) => handleDeleteFlow(flow.id, e)} className="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-rose-100 text-rose-400 rounded-lg transition-all" title="Apagar Registro">
                                                <Trash2 size={12}/>
                                            </button>
                                        </div>
                                        <div className="flex items-center justify-between text-[10px] font-medium text-slate-500 mt-3">
                                            <span className="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md">
                                                <HistoryIcon size={10}/> 
                                                {new Date(flow.date).toLocaleDateString('pt-BR')} às {new Date(flow.date).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}
                                            </span>
                                            <span className={`px-2 py-1 rounded-md font-bold uppercase tracking-wider ${flow.compliance > 70 ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-rose-50 text-rose-600 border border-rose-100'}`}>
                                                {flow.compliance}% Conformidade
                                            </span>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                )}

                {/* MODAL: FOTOS */}
                {fullscreenPhotos && (
                    <div className="fixed inset-0 z-[5000] bg-white/95 backdrop-blur-xl flex flex-col py-6">
                        <div className="w-full px-10 flex items-center justify-between flex-shrink-0 z-20">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-black uppercase text-slate-400 opacity-60">Campo: {String(fullscreenTitle)}</span>
                                <span className="text-sm font-black text-[#7b1113]">Foto {photoIndex + 1} de {fullscreenPhotos.length}</span>
                            </div>
                            <button className="bg-slate-100 hover:bg-rose-100 text-rose-500 p-3 rounded-full transition-colors shadow-md" onClick={() => setFullscreenPhotos(null)}>
                                <X size={24} />
                            </button>
                        </div>
                        <div className="flex-1 w-full flex items-center justify-center relative px-4 overflow-hidden mt-2">
                            <button disabled={photoIndex === 0} onClick={() => setPhotoIndex(prev => prev - 1)} className={`absolute left-4 md:left-10 z-10 p-4 rounded-full bg-white shadow-2xl transition-all ${photoIndex === 0 ? 'opacity-20 pointer-events-none' : 'hover:scale-110 active:scale-95'}`} style={{ color: GRENA_COLOR }}>
                                <ChevronLeft size={48} />
                            </button>
                            <div className="w-full h-full flex items-center justify-center p-2 md:p-8">
                                <img src={fullscreenPhotos[photoIndex]} className="max-w-full max-h-full object-contain drop-shadow-2xl animate-in zoom-in-95 duration-500 rounded-lg" />
                            </div>
                            <button disabled={photoIndex === fullscreenPhotos.length - 1} onClick={() => setPhotoIndex(prev => prev + 1)} className={`absolute right-4 md:right-10 z-10 p-4 rounded-full bg-white shadow-2xl transition-all ${photoIndex === fullscreenPhotos.length - 1 ? 'opacity-20 pointer-events-none' : 'hover:scale-110 active:scale-95'}`} style={{ color: GRENA_COLOR }}>
                                <ChevronRight size={48} />
                            </button>
                        </div>
                    </div>
                )}

                {/* MODAL: TEXTO */}
                {fullscreenText !== null && (
                    <div className="fixed inset-0 z-[5000] bg-white/95 backdrop-blur-xl flex items-center justify-center p-6 animate-in fade-in duration-300" onClick={() => setFullscreenText(null)}>
                    <div className="bg-white w-full max-w-4xl max-h-[80vh] rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col animate-in zoom-in-95 duration-300" onClick={e => e.stopPropagation()}>
                        <div className="p-6 border-b flex items-center justify-between bg-slate-50">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-black text-[#7b1113] uppercase tracking-[0.2em]">{String(fullscreenTextLabel)}</span>
                            <span className="text-xl font-bold text-slate-800">{String(fullscreenTitle)}</span>
                        </div>
                        <button onClick={() => setFullscreenText(null)} className="p-2 hover:bg-slate-200 rounded-full transition-colors"><X size={24} /></button>
                        </div>
                        <div className="p-8 overflow-y-auto bg-white">
                        <p className="text-lg text-slate-700 leading-relaxed whitespace-pre-wrap font-medium">{String(fullscreenText)}</p>
                        </div>
                    </div>
                    </div>
                )}

                {/* MODAL: PDF */}
                {fullscreenPdf && (
                    <div className="fixed inset-0 z-[5000] bg-white/95 backdrop-blur-xl flex flex-col py-6 animate-in fade-in duration-300">
                        <div className="w-full px-10 flex items-center justify-between flex-shrink-0 z-20 mb-4">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Campo: {String(fullscreenPdf.label)}</span>
                                <span className="text-sm font-black text-[#7b1113] flex items-center gap-2"><FilePdf size={16}/> {String(fullscreenPdf.pdf.name)}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <a href={fullscreenPdf.pdf.data} download={fullscreenPdf.pdf.name} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold transition-colors shadow-sm flex items-center gap-2 text-[11px] uppercase tracking-wider">
                                    <FileDown size={14}/> Baixar / Abrir Externamente
                                </a>
                                <button onClick={() => setFullscreenPdf(null)} className="bg-slate-100 hover:bg-rose-100 text-rose-500 p-2.5 rounded-xl transition-colors shadow-md"><X size={20} /></button>
                            </div>
                        </div>
                        <div className="flex-1 w-full px-4 md:px-10 pb-4 overflow-hidden">
                            <div className="w-full h-full relative rounded-xl overflow-hidden shadow-inner border border-slate-300 bg-slate-200/50">
                                {isRenderingPdf && (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-200/80 z-10 backdrop-blur-sm">
                                        <i className="fa-solid fa-spinner fa-spin text-3xl mb-4 text-[#7b1113]"></i>
                                        <p className="text-xs font-bold uppercase tracking-wider text-slate-500">A processar páginas do PDF...</p>
                                    </div>
                                )}
                                <div className="w-full h-full overflow-y-auto flex flex-col items-center p-4 relative" ref={pdfContainerRef}>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL: EXCEL */}
                {fullscreenExcel && (
                    <div className="fixed inset-0 z-[5000] bg-white/95 backdrop-blur-xl flex flex-col py-6 animate-in fade-in duration-300">
                        <div className="w-full px-10 flex items-center justify-between flex-shrink-0 z-20 mb-4">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Campo: {String(fullscreenExcel.label)}</span>
                                <span className="text-sm font-black text-[#7b1113] flex items-center gap-2"><FileExcel size={16}/> {String(fullscreenExcel.name)}</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-[10px] font-bold text-emerald-600 uppercase bg-emerald-100 px-3 py-1 rounded-full border border-emerald-200 hidden md:block">Planilha Editável</span>
                                <button onClick={handleCloseExcel} className="px-4 py-2 bg-[#7b1113] hover:bg-[#7b1113]/80 text-white rounded-xl font-bold flex items-center gap-2 transition-colors shadow-lg"><Save size={14}/> Salvar & Fechar</button>
                            </div>
                        </div>
                        <div className="flex-1 w-full px-4 md:px-10 pb-4 overflow-hidden">
                            <div className="w-full h-full bg-white rounded-xl shadow-2xl border border-slate-200 p-4 overflow-auto">
                                <div ref={jexcelContainerRef} className="w-full h-full"></div>
                            </div>
                        </div>
                    </div>
                )}

                {/* NAVEGAÇÃO SUPERIOR */}
                <nav className="h-16 bg-white border-b flex items-center justify-between px-6 z-[2000] shadow-sm flex-shrink-0">
                    <div>
                        <h1 className="text-lg font-black text-slate-800 uppercase tracking-tight leading-none">Auditoria Interna - Fluxo</h1>
                        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Gestão de Riscos e Processos</p>
                    </div>
                    <div className="flex items-center gap-3">
                        <div className="flex bg-slate-100 rounded-xl p-1 border border-slate-200 mr-2">
                            <button onClick={() => setZoom(z => Math.max(z - 0.1, 0.3))} className="p-1.5 hover:bg-white rounded-lg text-slate-500 transition-colors"><Minimize2 size={14}/></button>
                            <div className="px-2 text-[10px] font-black text-slate-600 w-10 text-center flex items-center justify-center">{Math.round(zoom * 100)}%</div>
                            <button onClick={() => setZoom(z => Math.min(z + 0.1, 2))} className="p-1.5 hover:bg-white rounded-lg text-slate-500 transition-colors"><Maximize2 size={14}/></button>
                        </div>
                        
                        <button onClick={addNode} className="bg-slate-800 text-white px-4 py-2 rounded-xl flex items-center gap-2 font-bold text-[11px] hover:bg-black transition-all shadow-md active:scale-95 uppercase tracking-tighter">
                            <Plus size={14} /> Nova Etapa
                        </button>

                        <button onClick={addEndNode} className="bg-emerald-700 text-white px-4 py-2 rounded-xl flex items-center gap-2 font-bold text-[11px] hover:bg-emerald-800 transition-all shadow-md active:scale-95 uppercase tracking-tighter">
                            <Flag size={14} /> Finalizar Processo
                        </button>
                        
                        <div className="h-8 w-px bg-slate-200 mx-1" />
                        
                        {/* Funcionalidades de Backup Restauradas */}
                        <button onClick={() => importFileRef.current.click()} className="flex items-center gap-2 border px-3 py-2 rounded-xl text-[10px] font-bold transition-all shadow-sm uppercase bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200">
                            <FileImport size={14} /> Importar Backup
                        </button>
                        <input type="file" accept=".json" ref={importFileRef} onChange={handleImportBackup} className="hidden" />
