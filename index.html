<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lousa Estratégica de Auditoria</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Compilação JSX no browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Exportação PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .main-viewport { outline: none; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        // --- MAPEAMENTO DE ÍCONES (FontAwesome no lugar do Lucide) ---
        const Plus = (props) => <i className={`fa-solid fa-plus ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Trash2 = (props) => <i className={`fa-solid fa-trash-can ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Maximize2 = (props) => <i className={`fa-solid fa-expand ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Minimize2 = (props) => <i className={`fa-solid fa-compress ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Save = (props) => <i className={`fa-solid fa-floppy-disk ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronDown = (props) => <i className={`fa-solid fa-chevron-down ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronUp = (props) => <i className={`fa-solid fa-chevron-up ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Building2 = (props) => <i className={`fa-solid fa-building ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const User = (props) => <i className={`fa-solid fa-user ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const MapPin = (props) => <i className={`fa-solid fa-location-dot ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Camera = (props) => <i className={`fa-solid fa-camera ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ImageIcon = (props) => <i className={`fa-regular fa-image ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const X = (props) => <i className={`fa-solid fa-xmark ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ZoomIn = (props) => <i className={`fa-solid fa-magnifying-glass-plus ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Expand = (props) => <i className={`fa-solid fa-up-right-and-down-left-from-center ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Tag = (props) => <i className={`fa-solid fa-tag ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Target = (props) => <i className={`fa-solid fa-bullseye ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const FileDown = (props) => <i className={`fa-solid fa-file-pdf ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronLeft = (props) => <i className={`fa-solid fa-chevron-left ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const ChevronRight = (props) => <i className={`fa-solid fa-chevron-right ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const AlertTriangle = (props) => <i className={`fa-solid fa-triangle-exclamation ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const Activity = (props) => <i className={`fa-solid fa-chart-line ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const PlusCircle = (props) => <i className={`fa-solid fa-circle-plus ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;
        const FileImport = (props) => <i className={`fa-solid fa-file-import ${props.className || ''}`} style={{fontSize: props.size}} {...props}/>;

        // --- CONFIGURAÇÃO DE CORES ---
        const GRENA_COLOR = "#7b1113";

        const analyzeRisk = (data) => {
            const textToAnalyze = `${data.weakness || ''} ${data.description || ''} ${data.title || ''}`.toLowerCase();
            const critical = ['fraude', 'perda', 'interrupção', 'parada', 'multa', 'crítico', 'grave', 'ruptura', 'financeiro', 'corrupção'];
            const attention = ['atraso', 'falha', 'divergência', 'manual', 'desvio', 'inconsistência', 'pendente'];

            if (data.weakness && String(data.weakness).trim() !== '') return 'Alto';
            if (data.pop === 'Não' || critical.some(k => textToAnalyze.includes(k))) return 'Alto';
            if (attention.some(k => textToAnalyze.includes(k))) return 'Médio';
            return 'Baixo';
        };

        // --- COMPONENTE DO BLOCO (ETAPA) ---
        const NodeItem = ({ 
            node, 
            updateNodeData, 
            deleteNode, 
            toggleExpand, 
            draggingNodeId, 
            activeNodeId,
            handleMouseDown, 
            onOpenFullscreenPhoto,
            onOpenFullscreenText,
            addCustomField,
            updateCustomField,
            removeCustomField
        }) => {
            const { id, data, expanded, x, y } = node;
            const fileInputRef = useRef(null);
            
            const colors = data.risk === 'Alto' ? { border: 'border-rose-600', bg: 'bg-rose-50', accent: 'bg-rose-600', text: 'text-rose-800' } :
                           data.risk === 'Médio' ? { border: 'border-amber-500', bg: 'bg-amber-50', accent: 'bg-amber-500', text: 'text-amber-800' } :
                           { border: 'border-emerald-500', bg: 'bg-emerald-50', accent: 'bg-emerald-600', text: 'text-emerald-800' };

            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const currentPhotos = data.photos || [];
                        updateNodeData(id, 'photos', [...currentPhotos, reader.result]);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const removePhoto = (idx) => {
                const currentPhotos = [...(data.photos || [])];
                currentPhotos.splice(idx, 1);
                updateNodeData(id, 'photos', currentPhotos);
            };

            const zIndex = draggingNodeId === id ? 2000 : (activeNodeId === id ? 1500 : 10);

            return (
                <div 
                    className="absolute transition-all duration-300 ease-in-out"
                    style={{ 
                        left: x, 
                        top: y, 
                        width: expanded ? '350px' : '200px', 
                        zIndex: zIndex,
                        transform: draggingNodeId === id ? 'scale(1.02)' : 'scale(1)'
                    }}
                    onMouseDown={(e) => handleMouseDown(e, id)}
                >
                    <div className="mb-2 flex justify-center">
                        <div className="flex items-center gap-1 bg-white px-3 py-1 rounded-full border border-slate-300 shadow-md group hover:border-[#7b1113]/50 transition-colors">
                        <Tag size={10} className="text-[#7b1113]" />
                        <input 
                            value={data.superTitle || ''}
                            onChange={(e) => updateNodeData(id, 'superTitle', e.target.value)}
                            onMouseDown={e => e.stopPropagation()}
                            className="bg-transparent text-[10px] font-black text-[#7b1113] uppercase tracking-widest outline-none text-center min-w-[60px] w-auto placeholder:text-slate-400"
                            placeholder="Rótulo"
                        />
                        </div>
                    </div>

                    <div className={`rounded-2xl shadow-xl border-2 overflow-hidden flex flex-col ${colors.border} ${colors.bg}`}>
                        <div className={`p-3 flex items-center justify-between flex-shrink-0 ${expanded ? 'border-b border-slate-200 bg-white' : 'bg-transparent'}`}>
                        <div className="flex items-center gap-2 flex-1 overflow-hidden">
                                <div className={`w-3 h-3 rounded-full flex-shrink-0 ${colors.accent}`}></div>
                                <input 
                                    value={data.title || ''}
                                    onChange={(e) => updateNodeData(id, 'title', e.target.value)}
                                    onMouseDown={e => e.stopPropagation()}
                                    className={`font-bold text-sm bg-transparent outline-none w-full text-slate-800 focus:bg-slate-50 rounded px-1 truncate ${!expanded ? 'cursor-default' : ''}`}
                                    placeholder="Título"
                                    readOnly={!expanded}
                                />
                            </div>
                            <div className="flex items-center gap-2 ml-2">
                                {expanded && (
                                <div className="relative">
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); fileInputRef.current?.click(); }}
                                        className="p-1 rounded-md transition-all text-slate-400 hover:bg-slate-100 hover:text-[#7b1113]"
                                        title="Anexar Fotos"
                                    >
                                        <Camera size={14} />
                                    </button>
                                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" multiple onChange={handleFileChange} />
                                </div>
                                )}
                                <button onClick={(e) => { e.stopPropagation(); toggleExpand(id); }} className="p-1 hover:bg-slate-100 rounded-md transition-colors text-slate-500">
                                    {expanded ? <ChevronUp size={14}/> : <Maximize2 size={12}/>}
                                </button>
                                {expanded && (
                                <button onClick={(e) => { e.stopPropagation(); deleteNode(id); }} className="p-1 hover:bg-rose-100 rounded-md text-rose-500 transition-colors">
                                    <Trash2 size={14}/>
                                </button>
                                )}
                            </div>
                        </div>

                        {/* ÁREA DE CONTEÚDO */}
                        <div className={`transition-all duration-300 ease-in-out overflow-hidden ${expanded ? 'max-h-none opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="p-4 space-y-4">
                                <div className="grid grid-cols-1 gap-2 bg-white p-3 rounded-xl border border-slate-300 shadow-sm">
                                    <div className="flex items-center gap-2 border-b border-slate-200 pb-2">
                                        <Building2 size={14} className="text-slate-500 flex-shrink-0"/>
                                        <input value={data.department || ''} onChange={(e) => updateNodeData(id, 'department', e.target.value)} onMouseDown={e => e.stopPropagation()} className="text-xs bg-transparent outline-none w-full text-slate-800 placeholder:text-slate-400 font-medium" placeholder="Departamento..." />
                                    </div>
                                    <div className="flex items-center gap-2 border-b border-slate-200 pb-2">
                                        <User size={14} className="text-slate-500 flex-shrink-0"/>
                                        <input value={data.collaborator || ''} onChange={(e) => updateNodeData(id, 'collaborator', e.target.value)} onMouseDown={e => e.stopPropagation()} className="text-xs bg-transparent outline-none w-full text-slate-800 placeholder:text-slate-400 font-medium" placeholder="Colaborador..." />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <MapPin size={14} className="text-slate-500 flex-shrink-0"/>
                                        <input value={data.originUnit || ''} onChange={(e) => updateNodeData(id, 'originUnit', e.target.value)} onMouseDown={e => e.stopPropagation()} className="text-xs bg-transparent outline-none w-full text-slate-800 placeholder:text-slate-400 font-medium" placeholder="Unidade..." />
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <div className="flex items-center justify-between">
                                        <label className="text-[9px] font-black text-slate-500 uppercase tracking-wider">Mapeamento</label>
                                        <button onMouseDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onOpenFullscreenText(data.description, 'Mapeamento', data.title); }} className="p-1 hover:bg-slate-200 rounded text-slate-500">
                                            <Expand size={12} />
                                        </button>
                                    </div>
                                    <textarea 
                                        value={data.description || ''} 
                                        onChange={(e) => updateNodeData(id, 'description', e.target.value)} 
                                        onMouseDown={e => e.stopPropagation()} 
                                        className="w-full bg-white border border-slate-300 shadow-sm text-xs p-2 rounded-lg outline-none resize-none min-h-[80px] text-slate-700 focus:ring-2 focus:ring-[#7b1113]/20 focus:border-[#7b1113] transition-all" 
                                        placeholder="Descreva o fluxo..." 
                                        onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-slate-500 uppercase">Possui POP?</label>
                                        <select value={data.pop || 'Sim'} onChange={(e) => updateNodeData(id, 'pop', e.target.value)} onMouseDown={e => e.stopPropagation()} className={`w-full text-xs p-2 rounded-lg outline-none font-bold border border-slate-300 shadow-sm ${data.pop === 'Não' ? 'bg-rose-50 text-rose-700 border-rose-300' : 'bg-white text-slate-700'}`}>
                                            <option value="Sim">Sim</option>
                                            <option value="Não">Não</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-bold text-slate-500 uppercase">Risco</label>
                                        <div className={`text-xs p-2 rounded-lg font-bold text-center border shadow-sm ${data.risk === 'Alto' ? 'bg-rose-50 text-rose-700 border-rose-300' : data.risk === 'Médio' ? 'bg-amber-50 text-amber-700 border-amber-300' : 'bg-emerald-50 text-emerald-700 border-emerald-300'}`}>
                                            {data.risk || 'Baixo'}
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <div className="flex items-center justify-between">
                                        <label className="text-[9px] font-black text-rose-600 uppercase tracking-wider">Fragilidades</label>
                                        <button onMouseDown={e => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onOpenFullscreenText(data.weakness, 'Fragilidades', data.title); }} className="p-1 hover:bg-rose-100 rounded text-rose-500">
                                            <Expand size={12} />
                                        </button>
                                    </div>
                                    <textarea 
                                        value={data.weakness || ''} 
                                        onChange={(e) => updateNodeData(id, 'weakness', e.target.value)} 
                                        onMouseDown={e => e.stopPropagation()} 
                                        className={`w-full bg-white text-xs p-2 rounded-lg outline-none resize-none min-h-[80px] border border-slate-300 shadow-sm focus:ring-2 focus:ring-[#7b1113]/20 focus:border-[#7b1113] transition-all text-slate-700 border-l-4 ${data.risk === 'Alto' ? 'border-l-rose-500' : 'border-l-slate-400'}`} 
                                        placeholder="Pontos críticos..." 
                                        onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                                    />
                                </div>

                                {/* NOVOS CAMPOS CUSTOMIZADOS (+) */}
                                <div className="space-y-4 pt-2 border-t border-slate-200/50">
                                    {data.customFields?.map((field) => (
                                        <div key={field.id} className="space-y-1 group/field relative animate-in slide-in-from-top-2 duration-300">
                                            <div className="flex items-center justify-between">
                                                <input 
                                                    value={field.label}
                                                    onChange={(e) => updateCustomField(id, field.id, 'label', e.target.value)}
                                                    onMouseDown={e => e.stopPropagation()}
                                                    className="text-[9px] font-black text-slate-500 uppercase tracking-wider bg-transparent outline-none focus:text-[#7b1113] border-b border-transparent focus:border-[#7b1113]/20 w-full transition-all"
                                                    placeholder="Título do campo (ex: Recomendação)"
                                                />
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); removeCustomField(id, field.id); }}
                                                    className="opacity-0 group-hover/field:opacity-100 p-1 text-rose-500 hover:text-rose-700 transition-opacity"
                                                >
                                                    <Trash2 size={12} />
                                                </button>
                                            </div>
                                            <textarea 
                                                value={field.value}
                                                onChange={(e) => updateCustomField(id, field.id, 'value', e.target.value)}
                                                onMouseDown={e => e.stopPropagation()}
                                                className="w-full bg-white border border-slate-300 shadow-sm text-xs p-2 rounded-lg outline-none resize-none min-h-[60px] focus:ring-2 focus:ring-[#7b1113]/20 focus:border-[#7b1113] transition-all text-slate-700"
                                                placeholder="Conteúdo informativo..."
                                                onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                                            />
                                        </div>
                                    ))}
                                    
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); addCustomField(id); }}
                                        className="w-full py-2 border-2 border-dashed border-slate-300 bg-slate-50 rounded-xl flex items-center justify-center gap-2 text-[10px] font-black text-slate-500 hover:border-[#7b1113]/40 hover:text-[#7b1113] hover:bg-[#7b1113]/5 transition-all group shadow-sm"
                                    >
                                        <PlusCircle size={14} className="group-hover:scale-110 transition-transform" /> 
                                        ADICIONAR PONTO ESPECÍFICO
                                    </button>
                                </div>
                                
                                {data.photos && data.photos.length > 0 && (
                                    <div className="space-y-2 pt-2 border-t border-slate-200/50">
                                        <label className="text-[9px] font-black text-blue-600 uppercase tracking-wider">Evidências ({data.photos.length})</label>
                                        <div className="grid grid-cols-3 gap-2 pb-4">
                                            {data.photos.map((ph, idx) => (
                                                <div key={idx} className="relative group aspect-square rounded-lg overflow-hidden border border-slate-200 cursor-pointer" onClick={(e) => { e.stopPropagation(); onOpenFullscreenPhoto(data.photos, idx, data.title); }}>
                                                    <img src={ph} alt="Evidência" className="w-full h-full object-cover transition-transform group-hover:scale-110" />
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); removePhoto(idx); }}
                                                        className="absolute top-1 right-1 bg-black/50 text-white p-0.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
                                                    >
                                                        <X size={10} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="px-3 py-2 flex items-center justify-between text-[10px] text-slate-400 font-bold bg-white/20 border-t border-slate-200">
                                <span>ETAPA AUDITADA</span>
                                <span className="opacity-50 tracking-widest">{String(id).slice(-4)}</span>
                            </div>
                        </div>

                        {!expanded && (
                        <div className={`px-3 py-1.5 text-[9px] font-black uppercase text-center rounded-b-2xl opacity-90 ${colors.text} flex items-center justify-center gap-2 border-t border-white/20`}>
                            {data.photos?.length > 0 && <Camera size={10} className="text-[#7b1113] animate-pulse" />}
                            {data.risk} Risco
                        </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL (APLICAÇÃO) ---
        function App() {
            const [nodes, setNodes] = useState([]);
            const [edges, setEdges] = useState([]);
            const [zoom, setZoom] = useState(0.85);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [isDraggingCanvas, setIsDraggingCanvas] = useState(false);
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const [activeNodeId, setActiveNodeId] = useState(null); 
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [saveStatus, setSaveStatus] = useState(null);
            
            const [fullscreenPhotos, setFullscreenPhotos] = useState(null);
            const [photoIndex, setPhotoIndex] = useState(0);
            const [fullscreenTitle, setFullscreenTitle] = useState("");
            const [fullscreenText, setFullscreenText] = useState(null);
            const [fullscreenTextLabel, setFullscreenTextLabel] = useState("");

            const canvasRef = useRef(null);
            const exportRef = useRef(null);
            const importFileRef = useRef(null);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('audit_flow_data_html');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        setNodes(parsed.nodes || []);
                        setEdges(parsed.edges || []);
                        return;
                    }
                } catch (e) { 
                    console.error("Storage access error:", e); 
                }
                
                setNodes([{
                    id: '1', x: 100, y: 50, type: 'start', expanded: true,
                    data: { 
                        superTitle: 'AUDITORIA', 
                        title: 'Início do Processo', 
                        pop: 'Sim', 
                        risk: 'Baixo',
                        customFields: []
                    }
                }]);
            }, []);

            const riskMetrics = useMemo(() => {
                const total = nodes.length;
                const low = nodes.filter(n => n.data.risk === 'Baixo').length;
                return { complianceRate: total > 0 ? Math.round((low / total) * 100) : 0 };
            }, [nodes]);

            const openFullscreenText = (text, label, title) => {
                setFullscreenText(text || "Sem conteúdo preenchido.");
                setFullscreenTextLabel(label);
                setFullscreenTitle(title || "Sem Título");
            };

            const handleSaveAndExport = () => {
                try {
                    const dataObj = { nodes, edges };
                    const dataStr = JSON.stringify(dataObj);
                    
                    // 1. Salvar no LocalStorage (Navegador)
                    localStorage.setItem('audit_flow_data_html', dataStr);
                    
                    // 2. Gerar Arquivo de Backup (.json)
                    const blob = new Blob([dataStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    
                    // Nome do arquivo com data atual
                    const dateFormatted = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
                    link.download = `Backup_Auditoria_${dateFormatted}.json`;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    setSaveStatus("Progresso Salvo e Arquivo de Backup Gerado!");
                } catch (e) {
                    setSaveStatus("Aviso: Erro ao salvar o progresso.");
                    console.error(e);
                }
                setTimeout(() => setSaveStatus(null), 3500);
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData.nodes && parsedData.edges) {
                            setNodes(parsedData.nodes);
                            setEdges(parsedData.edges);
                            setSaveStatus("Backup importado com sucesso!");
                        } else {
                            alert("Arquivo inválido. Certifique-se de que é um backup gerado por esta lousa.");
                        }
                    } catch (error) {
                        alert("Erro ao ler o arquivo. O formato pode estar corrompido.");
                    }
                    setTimeout(() => setSaveStatus(null), 3000);
                };
                reader.readAsText(file);
                
                // Reseta o input para permitir importar o mesmo arquivo novamente, se necessário
                e.target.value = '';
            };

            const handleGeneratePDF = async () => {
                setSaveStatus("Processando PDF...");
                try {
                    const canvas = await window.html2canvas(exportRef.current, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width, canvas.height] });
                    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                    pdf.save(`Fluxo_Auditoria_${new Date().toLocaleDateString()}.pdf`);
                } catch (e) {
                    console.error("Erro ao gerar PDF:", e);
                } finally {
                    setSaveStatus(null);
                }
            };

            const handleMouseDown = useCallback((e, nodeId = null) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.closest('button')) {
                    if (nodeId) setActiveNodeId(nodeId);
                    return;
                }
                if (nodeId) {
                    setDraggingNodeId(nodeId); setActiveNodeId(nodeId);
                    const node = nodes.find(n => n.id === nodeId);
                    setDragStart({ x: e.clientX / zoom - node.x, y: e.clientY / zoom - node.y });
                } else {
                    setIsDraggingCanvas(true);
                    setDragStart({ x: e.clientX - offset.x, y: e.clientY - offset.y });
                }
            }, [nodes, offset, zoom]);

            const handleMouseMove = useCallback((e) => {
                if (draggingNodeId) {
                    setNodes(prev => prev.map(n => n.id === draggingNodeId ? { ...n, x: e.clientX / zoom - dragStart.x, y: e.clientY / zoom - dragStart.y } : n));
                } else if (isDraggingCanvas) {
                    setOffset({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
                }
            }, [draggingNodeId, isDraggingCanvas, dragStart, zoom]);

            const handleMouseUp = useCallback(() => { setDraggingNodeId(null); setIsDraggingCanvas(false); }, []);

            const updateNodeData = useCallback((id, field, value) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === id) {
                        const newData = { ...n.data, [field]: value };
                        if (['pop', 'weakness', 'description', 'title'].includes(field)) newData.risk = analyzeRisk(newData);
                        return { ...n, data: newData };
                    }
                    return n;
                }));
            }, []);

            // --- LÓGICA DE CAMPOS CUSTOMIZADOS ---
            const addCustomField = useCallback((id) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === id) {
                        const customFields = n.data.customFields || [];
                        return {
                        ...n,
                        data: {
                            ...n.data,
                            customFields: [...customFields, { id: Date.now(), label: 'NOVO CAMPO', value: '' }]
                        }
                        };
                    }
                    return n;
                }));
            }, []);

            const updateCustomField = useCallback((nodeId, fieldId, key, value) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === nodeId) {
                        const customFields = (n.data.customFields || []).map(f => 
                        f.id === fieldId ? { ...f, [key]: value } : f
                        );
                        return { ...n, data: { ...n.data, customFields } };
                    }
                    return n;
                }));
            }, []);

            const removeCustomField = useCallback((nodeId, fieldId) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === nodeId) {
                        const customFields = (n.data.customFields || []).filter(f => f.id !== fieldId);
                        return { ...n, data: { ...n.data, customFields } };
                    }
                    return n;
                }));
            }, []);

            const toggleExpand = useCallback((id) => {
                setActiveNodeId(id);
                setNodes(prev => prev.map(n => n.id === id ? { ...n, expanded: !n.expanded } : n));
            }, []);

            const deleteNode = useCallback((id) => {
                setNodes(prev => prev.filter(n => n.id !== id));
                setEdges(prev => prev.filter(e => e.source !== id && e.target !== id));
            }, []);

            const addNode = useCallback(() => {
                const lastNode = nodes[nodes.length - 1];
                const newNodeId = Date.now().toString();
                const newNode = {
                    id: newNodeId,
                    x: lastNode ? lastNode.x + (lastNode.expanded ? 400 : 250) : 100,
                    y: lastNode ? lastNode.y : 50,
                    type: 'process',
                    data: { 
                        superTitle: 'NOVA ETAPA', 
                        title: 'Etapa de Auditoria', 
                        pop: 'Sim', 
                        risk: 'Baixo',
                        customFields: []
                    },
                    expanded: true
                };
                setNodes(prev => [...prev, newNode]);
                setActiveNodeId(newNodeId);
                if (lastNode) setEdges(prev => [...prev, { id: `e${lastNode.id}-${newNodeId}`, source: lastNode.id, target: newNodeId }]);
            }, [nodes]);

            const renderedEdges = useMemo(() => {
                return edges.map(edge => {
                    const source = nodes.find(n => n.id === edge.source);
                    const target = nodes.find(n => n.id === edge.target);
                    if (!source || !target) return null;
                    const sw = source.expanded ? 350 : 200;
                    const tw = target.expanded ? 350 : 200;
                    const sx = source.x + sw / 2; const sy = source.y + 60; 
                    const tx = target.x + tw / 2; const ty = target.y + 60;
                    const dx = tx - sx; const dy = ty - sy;
                    const path = `M ${sx} ${sy} C ${sx + dx/2} ${sy}, ${tx - dx/2} ${ty}, ${tx} ${ty}`;
                    return <path key={edge.id} d={path} fill="none" stroke="#64748b" strokeWidth="3" markerEnd="url(#arrowhead)" />;
                });
            }, [edges, nodes]);

            return (
                <div className="h-screen w-full flex flex-col bg-slate-50 font-sans select-none overflow-hidden">
                
                {saveStatus && (
                    <div className="fixed top-20 right-6 bg-[#7b1113] text-white px-6 py-3 rounded-2xl shadow-2xl z-[6000] font-bold text-xs animate-in fade-in slide-in-from-right duration-300">
                    {String(saveStatus)}
                    </div>
                )}

                {/* GALERIA MAXIMIZADA COM NAVEGAÇÃO GRENÁ E RESOLUÇÃO MÁXIMA */}
                {fullscreenPhotos && (
                    <div className="fixed inset-0 z-[5000] bg-white/95 backdrop-blur-xl flex flex-col py-6">
                        <div className="w-full px-10 flex items-center justify-between flex-shrink-0 z-20">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-black uppercase text-slate-400 opacity-60">Etapa: {String(fullscreenTitle)}</span>
                                <span className="text-sm font-black text-[#7b1113]">Foto {photoIndex + 1} de {fullscreenPhotos.length}</span>
                            </div>
                            <button className="bg-slate-100 hover:bg-rose-100 text-rose-500 p-3 rounded-full transition-colors shadow-md" onClick={() => setFullscreenPhotos(null)}>
                                <X size={24} />
                            </button>
                        </div>
                        
                        <div className="flex-1 w-full flex items-center justify-center relative px-4 overflow-hidden mt-2">
                            <button 
                                disabled={photoIndex === 0} 
                                onClick={() => setPhotoIndex(prev => prev - 1)} 
                                className={`absolute left-4 md:left-10 z-10 p-4 rounded-full bg-white shadow-2xl transition-all ${photoIndex === 0 ? 'opacity-20 pointer-events-none' : 'hover:scale-110 active:scale-95'}`}
                                style={{ color: GRENA_COLOR }}
                            >
                                <ChevronLeft size={48} />
                            </button>
                            
                            <div className="w-full h-full flex items-center justify-center p-2 md:p-8">
                                <img 
                                    src={fullscreenPhotos[photoIndex]} 
                                    alt="Evidência" 
                                    className="max-w-full max-h-full object-contain drop-shadow-2xl animate-in zoom-in-95 duration-500 rounded-lg" 
                                />
                            </div>

                            <button 
                                disabled={photoIndex === fullscreenPhotos.length - 1} 
                                onClick={() => setPhotoIndex(prev => prev + 1)} 
                                className={`absolute right-4 md:right-10 z-10 p-4 rounded-full bg-white shadow-2xl transition-all ${photoIndex === fullscreenPhotos.length - 1 ? 'opacity-20 pointer-events-none' : 'hover:scale-110 active:scale-95'}`}
                                style={{ color: GRENA_COLOR }}
                            >
                                <ChevronRight size={48} />
                            </button>
                        </div>
                    </div>
                )}

                {/* TEXTO EXPANDIDO */}
                {fullscreenText !== null && (
                    <div className="fixed inset-0 z-[5000] bg-[#7b1113]/90 backdrop-blur-sm flex items-center justify-center p-6 animate-in fade-in duration-300" onClick={() => setFullscreenText(null)}>
                    <div className="bg-white w-full max-w-4xl max-h-[80vh] rounded-3xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-300" onClick={e => e.stopPropagation()}>
                        <div className="p-6 border-b flex items-center justify-between bg-slate-50">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-black text-[#7b1113] uppercase tracking-[0.2em]">{String(fullscreenTextLabel)}</span>
                            <span className="text-xl font-bold text-slate-800">{String(fullscreenTitle)}</span>
                        </div>
                        <button onClick={() => setFullscreenText(null)} className="p-2 hover:bg-slate-200 rounded-full transition-colors"><X size={24} /></button>
                        </div>
                        <div className="p-8 overflow-y-auto bg-white">
                        <p className="text-lg text-slate-700 leading-relaxed whitespace-pre-wrap font-medium">{String(fullscreenText)}</p>
                        </div>
                    </div>
                    </div>
                )}

                {/* Navegação Superior */}
                <nav className="h-16 bg-white border-b flex items-center justify-between px-6 z-[2000] shadow-sm flex-shrink-0">
                    <div>
                    <h1 className="text-lg font-black text-slate-800 uppercase tracking-tight leading-none">Auditoria Interna - Fluxo</h1>
                    <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Gestão de Riscos e Processos</p>
                    </div>
                    <div className="flex items-center gap-4">
                    <div className="flex bg-slate-100 rounded-xl p-1 border border-slate-200">
                        <button onClick={() => setZoom(z => Math.max(z - 0.1, 0.3))} className="p-1.5 hover:bg-white rounded-lg text-slate-500 transition-colors"><Minimize2 size={14}/></button>
                        <div className="px-2 text-[10px] font-black text-slate-600 w-10 text-center flex items-center justify-center">{Math.round(zoom * 100)}%</div>
                        <button onClick={() => setZoom(z => Math.min(z + 0.1, 2))} className="p-1.5 hover:bg-white rounded-lg text-slate-500 transition-colors"><Maximize2 size={14}/></button>
                    </div>
                    <button onClick={addNode} className="bg-[#7b1113] text-white px-4 py-2 rounded-xl flex items-center gap-2 font-bold text-[11px] hover:opacity-90 transition-all shadow-md active:scale-95 uppercase tracking-tighter">
                        <Plus size={14} className="mr-1" /> Nova Etapa
                    </button>
                    
                    <div className="h-8 w-px bg-slate-200 mx-2" />
                    
                    {/* Botão de Importar Backup */}
                    <input type="file" accept=".json" className="hidden" ref={importFileRef} onChange={handleImportBackup} />
                    <button onClick={() => importFileRef.current?.click()} className="flex items-center gap-2 bg-slate-100 text-slate-600 border border-slate-300 px-3 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-200 transition-all shadow-sm uppercase">
                        <FileImport size={14} className="mr-1" /> Importar Backup
                    </button>

                    <button onClick={handleSaveAndExport} className="flex items-center gap-2 bg-slate-800 text-white px-3 py-2 rounded-xl text-[10px] font-bold hover:bg-black transition-all shadow-md uppercase">
                        <Save size={14} className="mr-1" /> Salvar Backup
                    </button>
                    
                    <button onClick={handleGeneratePDF} className="flex items-center gap-2 bg-emerald-600 text-white px-3 py-2 rounded-xl text-[10px] font-bold hover:bg-emerald-700 transition-all shadow-md uppercase">
                        <FileDown size={14} className="mr-1" /> Gerar PDF
                    </button>
                    </div>
                </nav>

                {/* Barra de Conformidade */}
            <div className="bg-white border-b px-6 py-1.5 z-[1500] shadow-sm flex items-center justify-between border-t border-slate-200 flex-shrink-0">
                <div className="flex items-center gap-2 flex-1">
                <Target size={10} className="text-[#7b1113] mr-1" />
                <span className="text-[9px] font-bold text-slate-500 uppercase tracking-[0.1em]">Conformidade Geral:</span>
                <span className={`text-[10px] font-black ${riskMetrics.complianceRate > 70 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {riskMetrics.complianceRate}%
                </span>
                <div className="h-1 flex-1 max-w-[150px] bg-slate-200 rounded-full mx-3 overflow-hidden border border-slate-300">
                    <div className={`h-full transition-all duration-1000 ease-out ${riskMetrics.complianceRate > 70 ? 'bg-emerald-500' : 'bg-rose-500'}`} style={{ width: `${riskMetrics.complianceRate}%` }}></div>
                </div>
                <p className="text-[9px] font-semibold text-slate-500 tracking-tight lowercase italic opacity-80">análise de eficiência baseada em conformidade</p>
                </div>
            </div>

            {/* PAINEL PRINCIPAL COM BARRA DE ROLAGEM */}
            <div 
                ref={canvasRef}
                className={`flex-1 relative overflow-auto bg-slate-50 ${isDraggingCanvas ? 'cursor-grabbing' : 'cursor-default'} main-viewport`}
                onMouseDown={(e) => e.target.classList.contains('main-viewport') && handleMouseDown(e)}
                onMouseMove={handleMouseMove}
                onMouseUp={handleMouseUp}
                onMouseLeave={handleMouseUp}
            >
                <div 
                ref={exportRef} 
                className="relative min-w-[3000px] min-h-[3000px]" 
                style={{ transform: `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`, transformOrigin: '0 0' }}
                >
                <div className="absolute inset-0 pointer-events-none opacity-[0.15]" style={{ backgroundImage: 'radial-gradient(#475569 1.5px, transparent 1.5px)', backgroundSize: '40px 40px' }} />
                <svg className="absolute inset-0 w-full h-full pointer-events-none overflow-visible">
                    <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b" /></marker></defs>
                    {renderedEdges}
                </svg>
                {nodes.map(node => (
                    <NodeItem 
                        key={node.id} 
                        node={node} 
                        updateNodeData={updateNodeData} 
                        deleteNode={deleteNode} 
                        toggleExpand={toggleExpand} 
                        draggingNodeId={draggingNodeId} 
                        activeNodeId={activeNodeId} 
                        handleMouseDown={handleMouseDown} 
                        onOpenFullscreenPhoto={(photos, idx, title) => { setFullscreenPhotos(photos); setPhotoIndex(idx); setFullscreenTitle(title); }} 
                        onOpenFullscreenText={openFullscreenText}
                        addCustomField={addCustomField}
                        updateCustomField={updateCustomField}
                        removeCustomField={removeCustomField}
                        />
                    ))}
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
